upstream platform_408_dashboard {
    server 127.0.0.1:43127;
}

server {
    listen 80;
    listen [::]:80;
    server_name platform.arcol.site;

    client_max_body_size 2m;

    # Reporter URLs contain account keys; never write them to access logs.
    location ^~ /api/focus-reporter/ {
        access_log off;
        proxy_pass http://platform_408_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://platform_408_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
