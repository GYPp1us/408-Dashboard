{% extends "base.html" %}
{% block title %}账户与好友 · 408 Focus Console{% endblock %}
{% block content %}
<div class="page-head settings-page-head"><div><h1>账户与好友</h1><p>{{ auth_user.username }} · 通过用户名建立好友关系</p></div><a class="back-link" href="{{ url_for('user_dashboard', username=auth_user.username) }}">返回主页</a></div>
<section class="account-grid">
  {% include 'includes/friend_settings.html' %}
  {% if auth_user.role == 'site_owner' %}<article class="panel account-panel"><div class="account-panel-head"><div><h2 tabindex="0" data-tooltip="每个邀请码只能注册一次">发放邀请码</h2></div></div><button id="create-invitation" class="primary account-action" type="button">生成邀请码</button><div id="invitation-list" class="invitation-list"><div class="loading-row">正在读取邀请码...</div></div></article>{% endif %}
</section>
{% endblock %}
