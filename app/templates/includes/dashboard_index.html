<div id="activity-index-view" class="activity-view" data-activity-view-panel="index">
  <section class="home-index" data-detail-kind="index" data-detail-key="current" aria-label="专注指数">
    <header class="home-index-head"><div><h3 title="由每天的有效专注生成；点击详情查看日线、历史分时和参数">专注指数</h3></div><button type="button" class="home-index-details" data-detail-open data-detail-kind="index" data-detail-key="current" aria-label="打开专注指数详情" title="查看日线、历史分时和指数参数">详情 ↗</button></header>
    <div class="home-index-quote" data-tooltip-target="#index-data-note" tabindex="0"><strong data-index-points>—</strong><span data-index-change>等待行情</span><span id="index-data-note" data-index-updated class="sr-only" role="status">正在读取指数</span></div>
    <div class="home-index-metrics"><div><span>今日专注</span><strong data-index-focus>—</strong></div><div><span>当前状态</span><strong data-index-status>读取中</strong></div></div>
    <div class="home-index-chart-wrap"><div class="home-index-chart" data-index-chart role="img" aria-label="专注指数全天分时图，横轴零点至二十四点，虚线标记当前时间" data-tooltip="横轴固定展示 00:00–24:00；圆点为专注状态切换，复位箭头为当日收盘重置" tabindex="0"></div><p class="home-index-empty" data-index-empty hidden>暂无分时记录</p></div>
    <footer class="home-index-foot"><button type="button" data-index-retry hidden>重试</button></footer>
    <small class="home-index-hint"><a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener noreferrer" title="图表组件：TradingView Lightweight Charts">TradingView</a></small>
  </section>
</div>
